name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / pytest / ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e packages/manga_common
          pip install -r services/parser/requirements.txt
          pip install -r services/catalog/requirements.txt
          pip install -r services/library/requirements.txt
          pip install -r services/media/requirements.txt
          pip install -r services/control/requirements.txt
          pip install -r services/gateway/requirements.txt
          pip install -r services/scheduler/requirements.txt
          pip install -r services/notifier/requirements.txt
          pip install -r services/replica/requirements.txt
          pip install pytest pytest-asyncio pytest-cov respx ruff
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest --cov=packages --cov=services --cov-report=term-missing

  web:
    name: Web / typecheck / build / unit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Typecheck
        run: npm run typecheck
      - name: Component tests (vitest)
        run: npm test
      - name: Build
        run: npm run build
      - name: Node unit tests (progress/profiles)
        run: npm run test:unit

  docs-encoding:
    name: Docs / UTF-8 encoding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check docs encoding
        run: python scripts/check_docs_encoding.py

  mobile-web:
    name: Mobile / build:www
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            apps/mobile/package-lock.json
      # build:www runs the web build first, so the web workspace needs its deps too.
      - name: Install web dependencies
        working-directory: apps/web
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Install mobile dependencies
        working-directory: apps/mobile
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - name: Build mobile web bundle
        working-directory: apps/mobile
        run: npm run build:www

  ops-scripts:
    name: Ops / shell syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check ops shell syntax
        run: |
          bash -n scripts/ops/*.sh

  android:
    name: Android / assembleDebug
    runs-on: ubuntu-latest
    if: ${{ hashFiles('apps/android/gradlew') != '' }}
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

  compose:
    name: Compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config -q
