[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages", "services", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = [
  "E501",
  "B008",
  "SIM108",
  "RUF001",
  "RUF002",
  "RUF003",
  "ASYNC109",
  "ASYNC240",
  "UP046",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "B011", "E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "integration: requires a running service or network access",
  "network: hits a real upstream website (skipped by default)",
]

[tool.coverage.run]
source = ["packages", "services"]
branch = true
omit = ["*/tests/*", "*/migrations/*", "*/main.py"]
