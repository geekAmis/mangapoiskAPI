[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "manga-common"
version = "1.0.0"
description = "Shared contracts, settings and infrastructure helpers for MangaPoisk Reborn"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "email-validator>=2.2,<3",
  "SQLAlchemy>=2.0.36,<2.1",
  "asyncpg>=0.30,<1",
  "aiosqlite>=0.20,<1",
  "httpx>=0.28,<1",
  "redis>=5.2,<6",
  "PyJWT>=2.10,<3",
  "argon2-cffi>=23.1,<26",
  "orjson>=3.10,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["manga_common"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
