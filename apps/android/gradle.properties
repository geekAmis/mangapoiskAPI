org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
# The workspace user name contains Cyrillic characters; AGP otherwise refuses
# to configure on Windows. Gradle and javac handle this path correctly.
android.overridePathCheck=true
kotlin.code.style=official
